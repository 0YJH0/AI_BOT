benchmark_version: "1.0.0"
task: Franka-Pick-and-Lift-v0
controller: scripted_absolute_differential_ik
num_envs: 128
episodes_per_level: 256
max_steps: 300
output_dir: ../results/benchmark

success_criteria:
  minimum_height_above_table_m: 0.10
  maximum_mean_finger_position: 0.030
  maximum_ee_object_distance_m: 0.08
  sustained_steps: 10

levels:
  easy:
    seed: 7101
    randomization_config: randomization_easy.yaml
    description: Fixed object, physics, camera, and lighting parameters.
  medium:
    seed: 7102
    randomization_config: randomization_medium.yaml
    description: Random object planar pose, yaw, and mass; fixed friction and camera.
  hard:
    seed: 7103
    randomization_config: randomization_hard.yaml
    description: Wider object pose and mass ranges plus friction, camera, and lighting variation.
