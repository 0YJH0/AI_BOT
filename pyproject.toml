[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-lab-data-engine"
version = "0.1.0"
description = "Robot manipulation simulation, synthetic data generation, and benchmarking with Isaac Lab."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "matplotlib>=3.10,<4.0",
    # Matches the HDF5 1.14.6 DLL bundled with Isaac Sim 5.1 GUI plug-ins.
    "h5py==3.14.0",
]

[project.optional-dependencies]
ppo = [
    "rsl-rl-lib==3.1.2",
    "onnxscript>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
